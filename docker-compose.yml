services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    env_file: .db.env
    environment:
      MYSQL_DATABASE: lianai
    volumes:
      - mysql_data:/var/lib/mysql
      - ./initdb:/docker-entrypoint-initdb.d:ro
    networks:
      - lianai
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 20

  php:
    build: ./php
    environment:
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    restart: unless-stopped
    volumes:
      - ./html:/var/www/html
      - ./php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
    networks:
      - lianai
    depends_on:
      mysql:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8090:80"
    volumes:
      - ./html:/var/www/html:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - php
    networks:
      - lianai

volumes:
  mysql_data:

networks:
  lianai:
